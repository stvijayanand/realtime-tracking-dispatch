spring:
  application:
    name: dispatch-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVICE_PORT:8080}
  # Enforce 64 KB maximum request body size (Requirement 3.11, 10.8).
  # Returns HTTP 413 for oversized payloads.
  tomcat:
    max-http-form-post-size: 65536
    max-swallow-size: 65536

spring.servlet.multipart:
  max-request-size: 64KB
  max-file-size: 64KB

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
