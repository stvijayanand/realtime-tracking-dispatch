# Prometheus scrape configuration for the dispatch platform.
# Requirement 12.5: all services export metrics to Prometheus via scrape.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ingest-service"
    static_configs:
      - targets: ["ingest-service:8001"]
    metrics_path: /metrics

  - job_name: "dispatch-service"
    static_configs:
      - targets: ["dispatch-service:8080"]
    metrics_path: /actuator/prometheus

  - job_name: "notification-service"
    static_configs:
      - targets: ["notification-service:8002"]
    metrics_path: /metrics

  - job_name: "gateway-service"
    static_configs:
      - targets: ["gateway-service:8003"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
