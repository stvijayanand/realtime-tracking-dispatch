// Kafka SASL/PLAIN JAAS configuration for the KRaft cluster.
// Each service has its own credentials (principle of least privilege — ADR 004).
// Passwords are loaded from environment variables in docker-compose.yml.
KafkaServer {
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="admin"
    password="admin-secret"
    user_admin="admin-secret"
    user_ingest-service="${KAFKA_INGEST_PASSWORD}"
    user_dispatch-service="${KAFKA_DISPATCH_PASSWORD}"
    user_notification-service="${KAFKA_NOTIFICATION_PASSWORD}"
    user_gateway-service="${KAFKA_GATEWAY_PASSWORD}"
    user_tracking-service="${KAFKA_TRACKING_PASSWORD}";
};

KafkaClient {
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="admin"
    password="admin-secret";
};
